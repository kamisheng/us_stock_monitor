server:
  port: 8080

spring:
  datasource: # 数据源的相关配置
    type: com.zaxxer.hikari.HikariDataSource      # 数据源的类型，可以更改为其他的数据源配置，比如druid
    driver-class-name: com.mysql.cj.jdbc.Driver      # mysql/MariaDB 的数据库驱动类名称
    url: jdbc:mysql://127.0.0.1:5506/us_stock_monitor_dev?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: SZG071028
    hikari:
      pool-name: DataSourceHikariCP           # 连接池的名字
      connection-timeout: 30000               # 等待连接池分配连接的最大时间（毫秒），超过这个时长还没有可用的连接，则会抛出SQLException
      minimum-idle: 5                         # 最小连接数
      maximum-pool-size: 20                   # 最大连接数
      auto-commit: true                       # 自动提交
      idle-timeout: 600000                    # 连接超时的最大时长（毫秒），超时则会被释放（retired）
      max-lifetime: 18000000                  # 连接池的最大生命时长（毫秒），超时则会被释放（retired）
      connection-test-query: SELECT 1

  # ============ MCP 客户端：连 stock_mcp，把它的工具拿给 ChatClient 用 ============
  ai:
    mcp:
      client:
        enabled: true
        type: SYNC
        initialized: false
        # 默认只有 20s 工具执行 + LLM 往返容易被掐，放宽一点
        request-timeout: 60s
        # stock_mcp 实际跑的是 SSE 协议（端点是 /sse，不是 /mcp）
        sse:
          connections:
            stock-mcp:
              url: http://127.0.0.1:7070
              sse-endpoint: /sse
        # 默认就是 true：远程 MCP 工具会自动注册给 ChatClient，不用手写粘合代码
        toolcallback:
          enabled: true
    # ============ LLM：OpenAI 兼容协议，DeepSeek / OpenRouter 都走这个 ============
    openai:
      # 国内直连、稳定、便宜，推荐先用这个（不经过 Clash 代理）
      base-url: https://ws-kq6pusg1gjbz0ixj.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: sk-ws-H.PRXRYDI.phZy.MEUCIG6kPfgk30J52sSG639Z69rEYWP6SkAEz7eJGFbr4-xdAiEAypiGleRSZWK_8THY069G15t_9bu_bmmLapHFj79cbS4
      chat:
        model: qwen3.8-flash
        temperature: 0.3
      # 换成 OpenRouter 就改成：
      #   base-url: https://openrouter.ai/api/v1
      #   chat.options.model: deepseek/deepseek-v3.2   # 必须是 OpenRouter 上真实存在的 ID

# MyBatisPlus 的配置
mybatis-plus:
  global-config:
    db-config:
      id-type:
      update-strategy: not_empty
  mapper-locations: classpath*:com/kami/stock_web/mapper/xml/*.xml

telegram:
  enabled: true
  bot-token: 8708116678:AAGcYYpPNbTFUEnccqS_VQ25ivZ7kgxWi9Y
  # 定时推送的目标群（supergroup），群/频道 id 是负数，超级群以 -100 开头，建议加引号
  # 注意：私聊对话不受这个影响，回复目标是消息里的 chatId
  chat-id: "-1004292521385"
  # 必须走 HTTP 代理，否则连不上 api.telegram.org（实测不加代理会报 Unable to execute sendmessage method）
  proxy-host: 127.0.0.1
  proxy-port: 7897
  # 私聊白名单：只有这些 Telegram user id 能用机器人对话
  # 你自己的 user id 见 getUpdates 里的 message.from.id（当前是 7646425912）
  allowed-user-ids: "7646425912"
  # 单轮对话超时（毫秒），超时回复「超时」而不是一直卡住
  chat-timeout-ms: 60000
